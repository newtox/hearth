id: de.newtox.hearth
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: hearth
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: hearth
    buildsystem: simple
    sources:
      - type: file
        path: hearth.deb
        only-arches: [x86_64]
      - type: script
        dest-filename: hearth.sh
        commands:
          - exec zypak-wrapper /app/hearth/hearth "$@"
    build-commands:
      - ar -x hearth.deb
      - tar -xf data.tar.*
      - cp -r opt/Hearth /app/hearth
      - install -Dm755 hearth.sh /app/bin/hearth
      - install -Dm644 usr/share/applications/hearth.desktop /app/share/applications/de.newtox.hearth.desktop
      - desktop-file-edit --set-icon=de.newtox.hearth --set-key=Exec --set-value="hearth %U" /app/share/applications/de.newtox.hearth.desktop
      - for s in 16 32 48 64 128 256 512; do install -Dm644 usr/share/icons/hicolor/${s}x${s}/apps/hearth.png /app/share/icons/hicolor/${s}x${s}/apps/de.newtox.hearth.png; done
