name: hearth

services:
  db:
    image: postgres:16
    container_name: hearth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: hearth
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    container_name: hearth
    image: ${HEARTH_IMAGE:-ghcr.io/newtox/hearth:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      DATABASE_URL: postgres://hearth:${DB_PASSWORD}@db:5432/hearth
      TRUST_PROXY: "1"
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: hearth
      LIVEKIT_API_SECRET: ${LIVEKIT_SECRET:?Set LIVEKIT_SECRET}
      PUBLIC_URL: https://${CHAT_DOMAIN:?Set CHAT_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-on}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    volumes:
      - uploads:/data/uploads

  livekit:
    container_name: hearth-livekit
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "hearth: ${LIVEKIT_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  db:
  uploads:
