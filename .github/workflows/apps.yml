name: Apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: web
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - working-directory: web
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            node -e "const e=process.env;require('fs').writeFileSync('updater.json',JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:e.UPDATER_PUBKEY,endpoints:['https://github.com/'+e.GITHUB_REPOSITORY+'/releases/latest/download/latest.json'],windows:{installMode:'passive'}}}}))"
            npx tauri build --config updater.json
          else
            npx tauri build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Windows
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/nsis/*.exe.sig

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - working-directory: web
        run: npm ci
      - working-directory: desktop
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - working-directory: desktop
        run: npm run web
      - working-directory: desktop
        run: npx electron-builder --linux AppImage deb rpm --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/latest-linux.yml

  flatpak:
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hearth-Linux
          path: bundle
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          cp bundle/*.deb flatpak/hearth.deb
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build flatpak/de.newtox.hearth.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo hearth.flatpak de.newtox.hearth
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Flatpak
          path: hearth.flatpak

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MGR" --licenses > /dev/null || true
          NDK=$(ls -d "$SDK"/ndk/2[6-9].* 2>/dev/null | sort -V | tail -1)
          PKGS=("platforms;android-34" "build-tools;34.0.0")
          [ -z "$NDK" ] && PKGS+=("ndk;26.3.11579264")
          for i in 1 2 3; do timeout 15m "$MGR" "${PKGS[@]}" && break; [ "$i" = 3 ] && exit 1; sleep 20; done
          [ -z "$NDK" ] && NDK="$SDK/ndk/26.3.11579264"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set, the APK gets a new signature and cannot update an installed app"
          fi
      - working-directory: web
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - working-directory: web
        shell: bash
        run: |
          npx tauri android init --ci
          npx tauri icon app-icon.png
          cp src-tauri/android/MainActivity.kt "$(find src-tauri/gen/android/app/src/main -name MainActivity.kt)"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          npx tauri android build --apk --debug --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Android
          path: web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, linux, flatpak, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          v=${GITHUB_REF_NAME#v}
          mkdir out
          pick() { find artifacts -name "$1" | grep -i "${3:-.}" | head -n1 | xargs -r -I{} cp {} "out/$2"; }
          pick '*.exe' "Hearth_${v}_windows_x64_setup.exe"
          pick '*.AppImage' "Hearth_${v}_linux_x86_64.AppImage"
          pick '*.deb' "Hearth_${v}_linux_amd64.deb"
          pick '*.rpm' "Hearth_${v}_linux_x86_64.rpm"
          pick '*.flatpak' "Hearth_${v}_linux_x86_64.flatpak"
          pick '*.apk' "Hearth_${v}_android.apk" universal
          [ -e "out/Hearth_${v}_android.apk" ] || pick '*.apk' "Hearth_${v}_android.apk"
          find artifacts -name latest-linux.yml | head -n1 | xargs -r -I{} cp {} out/latest-linux.yml
          sig=$(find artifacts -name '*.exe.sig' | head -n1)
          if [ -n "$sig" ] && [ -e "out/Hearth_${v}_windows_x64_setup.exe" ]; then
            SIG="$(cat "$sig")" V="$v" node -e "const e=process.env;console.log(JSON.stringify({version:e.V,notes:'',pub_date:new Date().toISOString(),platforms:{'windows-x86_64':{signature:e.SIG,url:'https://github.com/'+e.GITHUB_REPOSITORY+'/releases/download/v'+e.V+'/Hearth_'+e.V+'_windows_x64_setup.exe'}}}))" > out/latest.json
          fi
          ls -la out
          [ -n "$(ls out)" ]
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
