name: Apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - working-directory: web
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - working-directory: web
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-${{ runner.os }}
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/appimage/*.AppImage
            web/src-tauri/target/release/bundle/deb/*.deb

  flatpak:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hearth-Linux
          path: bundle
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          cp bundle/deb/*.deb flatpak/hearth.deb
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build flatpak/de.newtox.hearth.yml
          flatpak build-bundle repo hearth.flatpak de.newtox.hearth
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Flatpak
          path: hearth.flatpak

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - working-directory: web
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - working-directory: web
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          npx tauri android init
          npx tauri icon app-icon.png
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          npx tauri android build --apk --debug --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-Android
          path: web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [desktop, flatpak, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          v=${GITHUB_REF_NAME#v}
          mkdir out
          pick() { find artifacts -name "$1" | grep -i "${3:-.}" | head -n1 | xargs -r -I{} cp {} "out/$2"; }
          pick '*.exe' "Hearth_${v}_windows_x64_setup.exe"
          pick '*.AppImage' "Hearth_${v}_linux_x86_64.AppImage"
          pick '*.deb' "Hearth_${v}_linux_amd64.deb"
          pick '*.flatpak' "Hearth_${v}_linux_x86_64.flatpak"
          pick '*.apk' "Hearth_${v}_android.apk" universal
          [ -e "out/Hearth_${v}_android.apk" ] || pick '*.apk' "Hearth_${v}_android.apk"
          ls -la out
          [ -n "$(ls out)" ]
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
