[package]
name = "hearth-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "derive", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
futures-util = "0.3"
dotenvy = "0.15"
tower = "0.5"
hmac = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
