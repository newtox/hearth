<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      body { margin: 0; padding: 18px; background: #1b1b1f; color: #f3f4fa; font: 14px system-ui, sans-serif; }
      h1 { font-size: 16px; margin: 0 0 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      button { display: grid; gap: 6px; padding: 8px; border: 1px solid #2c2e4a; border-radius: 10px; background: #24252c; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      button:hover, button:focus-visible { border-color: #8b6cff; outline: none; }
      img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 6px; }
      span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div class="grid" id="grid"></div>
    <script>
      const data = JSON.parse(new URLSearchParams(location.search).get('data') || '{"items":[]}');
      const titles = { de: 'Was möchtest du teilen?', da: 'Hvad vil du dele?' };
      document.getElementById('title').textContent = titles[(data.lang || '').slice(0, 2)] || 'What do you want to share?';
      const grid = document.getElementById('grid');
      for (const item of data.items) {
        const b = document.createElement('button');
        const img = document.createElement('img');
        img.src = item.thumb;
        img.alt = '';
        const label = document.createElement('span');
        label.textContent = item.name;
        b.append(img, label);
        b.onclick = () => (location.hash = encodeURIComponent(item.id));
        grid.append(b);
      }
      document.addEventListener('keydown', (e) => e.key === 'Escape' && window.close());
    </script>
  </body>
</html>
